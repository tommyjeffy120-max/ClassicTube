name: Build ClassicTube APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Set up compatible Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.6.4'

      - name: Extract ClassicTube project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*classictube*.zip' -print -quit)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "::error::ClassicTube ZIP not found in the repository root."
            echo "Upload ClassicTube-Android-Starter.zip to the repository root."
            exit 1
          fi

          echo "Found project archive: $ZIP_FILE"

          rm -rf source
          mkdir -p source

          unzip -q "$ZIP_FILE" -d source

          if [[ ! -f source/ClassicTube/settings.gradle ]] ||
             [[ ! -f source/ClassicTube/build.gradle ]] ||
             [[ ! -f source/ClassicTube/app/build.gradle ]]; then
            echo "::error::The ZIP does not have the expected project structure."
            find source -maxdepth 4 -type f -print | sort
            exit 1
          fi

          echo "Project files verified successfully."

      - name: Build APK
        working-directory: source/ClassicTube
        run: |
          gradle --version
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          APK="source/ClassicTube/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::The APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"
          file "$APK"

      - name: Publish downloadable APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: source/ClassicTube/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          archive: false
