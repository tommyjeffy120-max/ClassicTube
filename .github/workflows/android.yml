name: Build ClassicTube APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.6.4'

      - name: Extract and locate project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./ClassicTube Fullscreen Upd.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            matches=()
            while IFS= read -r -d '' file; do
              matches+=("$file")
            done < <(
              find . -maxdepth 1 -type f \
                -iname '*classictube*.zip' -print0
            )

            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "::error::Expected one ClassicTube ZIP."
              printf 'Found: %s\n' "${matches[@]:-none}"
              echo "Keep only the current project ZIP in the repository root."
              exit 1
            fi

            ZIP_FILE="${matches[0]}"
          fi

          echo "Using archive: $ZIP_FILE"

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_ROOT=""

          while IFS= read -r -d '' file; do
            case "$file" in
              */settings.gradle)
                root="${file%/settings.gradle}"
                ;;
              */settings.gradle.kts)
                root="${file%/settings.gradle.kts}"
                ;;
              *)
                continue
                ;;
            esac

            if [[ -f "$root/app/build.gradle" ||
                  -f "$root/app/build.gradle.kts" ]]; then
              if [[ -f "$root/build.gradle" ||
                    -f "$root/build.gradle.kts" ]]; then
                PROJECT_ROOT="$root"
                break
              fi
            fi
          done < <(
            find source -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \) -print0
          )

          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "::error::Could not locate a valid Android Gradle project."
            echo "Gradle files found:"
            find source -type f \
              \( -name settings.gradle \
                 -o -name build.gradle \
                 -o -name build.gradle.kts \
                 -o -name settings.gradle.kts \) -print
            exit 1
          fi

          echo "Found project root: $PROJECT_ROOT"
          echo "PROJECT_DIR=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Publish APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          archive: false
