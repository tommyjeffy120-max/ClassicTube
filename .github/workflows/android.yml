name: Build ClassicTube APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ClassicTube project
        run: |
          unzip -o ClassicTube-Android-Starter.zip -d source
          ls -la source/ClassicTube

      - name: Build APK
        working-directory: source/ClassicTube
        run: gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClassicTube-APK
          path: source/ClassicTube/app/build/outputs/apk/debug/*.apk
